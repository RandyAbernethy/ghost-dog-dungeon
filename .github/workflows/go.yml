name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: '1.26.9'
          - os: ubuntu-26.04
            go: '1.27.2'
          - os: windows-latest
            go: '1.27.2'
          - os: macos-latest
            go: '1.27.2'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      shell: bash
      run: |
        game_binary=./bin/ghostdog
        if [ "$RUNNER_OS" = Windows ]; then game_binary="$game_binary.exe"; fi
        go build -v -o "$game_binary" ./src

    - name: Test
      run: go test -count=1 -timeout 5m -v ./...

    - name: Vet
      run: go vet -v ./...
